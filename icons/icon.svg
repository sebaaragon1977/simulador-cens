<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="muc" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#ffb4a2"/><stop offset=".45" stop-color="#e2705f"/><stop offset=".8" stop-color="#8e2a26"/><stop offset="1" stop-color="#2a0807"/>
    </radialGradient>
    <radialGradient id="dark" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#1a0605"/><stop offset="1" stop-color="#3b0d0b"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14202a"/><stop offset="1" stop-color="#070b0f"/></linearGradient>
    <linearGradient id="turb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc9bb"/><stop offset="1" stop-color="#c9584b"/></linearGradient>
    <clipPath id="view"><circle cx="256" cy="256" r="170"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g clip-path="url(#view)">
    <rect width="512" height="512" fill="url(#muc)"/>
    <!-- coana / fondo oscuro -->
    <ellipse cx="262" cy="250" rx="46" ry="62" fill="url(#dark)"/>
    <!-- septum (izquierda) -->
    <path d="M86 60 C150 120 170 220 175 300 C178 370 150 430 120 470 L60 470 L60 60 Z" fill="#f09a86"/>
    <path d="M150 110 C170 200 178 280 170 380" stroke="#ffd6cc" stroke-width="6" fill="none" opacity=".55"/>
    <!-- cornete medio -->
    <path d="M440 120 C360 120 300 160 290 215 C285 245 305 262 330 255 C380 240 420 230 460 236 Z" fill="url(#turb)"/>
    <!-- cornete inferior -->
    <path d="M460 300 C380 290 300 310 285 360 C276 395 300 420 340 412 C390 402 430 400 470 410 Z" fill="url(#turb)"/>
    <ellipse cx="318" cy="200" rx="26" ry="10" fill="#fff" opacity=".35"/>
    <ellipse cx="320" cy="352" rx="28" ry="10" fill="#fff" opacity=".3"/>
  </g>
  <!-- borde de la óptica -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0a0f14" stroke-width="10"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#4fd1a5" stroke-width="14"/>
  <!-- marca de orientación del endoscopio -->
  <path d="M240 60 L272 60 L256 88 Z" fill="#e9ecef"/>
  <!-- cruz -->
  <g stroke="#9fffd0" stroke-width="5" opacity=".8"><line x1="256" y1="238" x2="256" y2="274"/><line x1="238" y1="256" x2="274" y2="256"/></g>
</svg>
